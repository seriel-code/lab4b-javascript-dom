<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 1 - Change Paragraph Text</title>
</head>
<body>
  <div id="myElement">
    <p>Welcome to my website!</p>
  </div>

  <script>
    const paragraph = document.querySelector("#myElement p");
    paragraph.textContent = "Hello there!";
  </script>
</body>
</html>
